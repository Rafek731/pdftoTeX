[project]
name = "pdftoTeX"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google>=3.0.0",
    "google-genai>=2.20.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"
